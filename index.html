<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КРИА! - Виртуальная компания</title>
    <style>
        /* Полный сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            background-color: #000;
            gap: 20px;
            border-bottom: 1px solid #111;
            z-index: 10;
        }

        .logo-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            padding: 6px;
        }

        .company-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 8px;
            max-width: 800px;
        }

        .search-icon {
            color: white;
            font-size: 22px;
            margin-right: 15px;
        }

        .search-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            width: 100%;
            outline: none;
            font-weight: 500;
        }
        
        .search-input::placeholder {
            color: #888;
        }

        /* Основной контент (Огромные карточки) */
        main {
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            gap: 40px;
            align-items: center;
        }

        /* --- КРАСИВЫЙ СКРОЛЛБАР ДЛЯ ГЛАВНОГО ЭКРАНА --- */
        main::-webkit-scrollbar {
            width: 8px;
        }
        main::-webkit-scrollbar-track {
            background: #000;
        }
        main::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        main::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Для Firefox */
        main {
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }
        /* ----------------------------------------------- */

        .movie-card {
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1400px; /* Широкие карточки */
            transition: transform 0.2s;
        }

        .glow-blue {
            box-shadow: 0 0 40px rgba(0, 102, 255, 0.6), 0 0 20px rgba(0, 102, 255, 0.4);
            border: 1px solid rgba(0, 102, 255, 0.3);
        }

        .glow-red {
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 20px rgba(255, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .movie-bg-blue {
            background: linear-gradient(90deg, #000a1a 0%, #0033aa 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            border-radius: 16px;
            min-height: 300px;
        }

        .movie-bg-red {
            background: linear-gradient(90deg, #1a0000 0%, #8b0000 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            border-radius: 16px;
            min-height: 300px;
        }

        .movie-info-row {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            position: relative;
        }

        .movie-logo {
            width: 160px; /* Увеличенный логотип */
            height: 160px;
            object-fit: contain;
            border-radius: 12px;
            margin-top: 10px;
        }

        .movie-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            padding-right: 220px;
            padding-top: 15px;
        }

        .movie-title {
            color: white;
            font-size: 38px; /* Крупный шрифт */
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        .movie-time {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 500;
        }

        .movie-controls {
            position: absolute;
            top: 0px; 
            right: 0px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1;
        }

        .tag-img {
            width: 240px; /* Огромная картинка */
            height: 240px;
            object-fit: contain;
            pointer-events: none; 
        }

        .info-btn {
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        .info-btn:hover {
            background: white;
            color: #000;
        }

        .info-popup {
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            position: absolute;
            top: 60px;
            right: 15px;
            width: 300px;
            z-index: 100;
            display: none;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            line-height: 1.5;
        }

        .info-popup.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .watch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 15px 30px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            width: fit-content;
            transition: 0.2s;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .watch-btn:hover {
            background: white;
            color: #000;
        }

        .company-info {
            margin-top: auto;
            padding: 40px 20px;
            text-align: center;
            color: #888;
            font-size: 16px;
            background: #000;
            width: 100%;
            border-top: 1px solid #1a1a1a;
        }

        .company-info span {
            color: #0066ff;
            font-weight: bold;
        }

        /* =========================================
           ПОЛНОЭКРАННЫЙ ВИДЕОПЛЕЕР (Pixel Style)
           ========================================= */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: none; /* Скрыто по умолчанию */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-overlay.active {
            display: flex;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Сохраняет пропорции видео */
            outline: none;
        }

        /* Кастомные контролы */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: opacity 0.3s;
            opacity: 1;
        }

        .custom-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Инфо в верхнем левом углу */
        .video-top-info {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: opacity 0.3s;
            opacity: 1;
            z-index: 10;
        }

        .video-top-info.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-mini-logo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: contain;
            background: rgba(0,0,0,0.5);
        }

        .video-mini-title {
            font-size: 22px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Кнопка закрытия (Крестик) */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, background 0.2s, transform 0.2s;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .close-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Нижняя панель управления */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .play-pause-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
        }

        .time-display {
            color: #ddd;
            font-size: 15px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            min-width: 110px;
        }

        /* Стильная полоса перемотки (Google Pixel Style) */
        .seek-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            height: 20px; /* Зона захвата */
            cursor: pointer;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2); /* Задний фон полосы */
            transition: height 0.1s;
        }

        input[type="range"]:hover {
            height: 6px;
        }

        /* Ползунок (Кружок) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transform: scale(0);
            transition: transform 0.2s;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            transform: scale(1);
        }

        input[type="range"]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            transform: scale(0);
            transition: transform 0.2s;
        }

        input[type="range"]:hover::-moz-range-thumb {
            transform: scale(1);
        }

        /* Адаптив */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            main { padding: 20px; gap: 20px; }
            .movie-bg-blue, .movie-bg-red { padding: 25px; min-height: 250px; }
            .movie-logo { width: 100px; height: 100px; }
            .movie-title { font-size: 24px; }
            .movie-details { padding-right: 100px; }
            .tag-img { width: 140px; height: 140px; }
            .info-btn { width: 28px; height: 28px; font-size: 16px; top: 10px; right: 10px; }
            .info-popup { width: 220px; font-size: 14px; top: 45px; right: 10px; }
            .watch-btn { font-size: 16px; padding: 12px 24px; }
            
            .custom-controls { padding: 20px; gap: 10px; }
            .video-top-info { top: 20px; left: 20px; }
            .video-mini-logo { width: 40px; height: 40px; }
            .video-mini-title { font-size: 16px; }
            .close-btn { top: 20px; right: 20px; width: 40px; height: 40px; font-size: 18px; }
            .time-display { font-size: 13px; min-width: 90px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <header>
            <div class="logo-circle">
                <img src="https://github.com/balovzena9-ops/KRIAP/blob/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F157_20261106153753.png?raw=true" alt="КРИА" class="company-logo">
            </div>
            
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <!-- ПЕРВАЯ КАРТОЧКА -->
            <div class="movie-card glow-blue movie-item">
                <div class="movie-bg-blue">
                    <div class="movie-info-row">
                        <img src="https://github.com/balovzena9-ops/KRIAP/blob/main/IMG_20261106_155146.jpg?raw=true" alt="Баловск 91" class="movie-logo">
                        
                        <div class="movie-details">
                            <div class="movie-title">"БАЛОВСК 91"</div>
                            <div class="movie-time">время: 2:31</div>
                        </div>

                        <div class="movie-controls">
                            <img src="https://github.com/balovzena9-ops/KRIAP/blob/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F159_20261106161115.png?raw=true" alt="Тег" class="tag-img">
                            <button class="info-btn" onclick="toggleInfo(event, 'infoPopup1')">i</button>
                            <div class="info-popup" id="infoPopup1">
                                Фильм про Баловск, про провальный самолет, происхождения 1991 года
                            </div>
                        </div>
                    </div>

                    <button class="watch-btn" onclick="openVideo('https://github.com/balovzena9-ops/KRIAP/releases/download/KRIAP/VID_20261106_153509.mp4', 'https://github.com/balovzena9-ops/KRIAP/blob/main/IMG_20261106_155146.jpg?raw=true', 'БАЛОВСК 91')">
                        СМОТРЕТЬ <span style="font-size: 16px; margin-top: 2px;">▶</span>
                    </button>
                </div>
            </div>

            <!-- ВТОРАЯ КАРТОЧКА -->
            <div class="movie-card glow-red movie-item">
                <div class="movie-bg-red">
                    <div class="movie-info-row">
                        <img src="https://github.com/balovzena9-ops/KRIAP/blob/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F128_20261106164158.png?raw=true" alt="MayUmshka" class="movie-logo">
                        
                        <div class="movie-details">
                            <div class="movie-title">MayUmshka</div>
                            <div class="movie-time" style="color: #ff9999;">Ожидается в 2027 году</div>
                        </div>

                        <div class="movie-controls">
                            <img src="https://github.com/balovzena9-ops/KRIAP/blob/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F159_20261106163828.png?raw=true" alt="Тег" class="tag-img">
                            <button class="info-btn" onclick="toggleInfo(event, 'infoPopup2')">i</button>
                            <div class="info-popup" id="infoPopup2">
                                MayUmshka-сериал колаб с MYRUNPLAY>_ хоррор сериал, на 4 серии (4 главы игры)
                            </div>
                        </div>
                    </div>

                    <button class="watch-btn" onclick="openVideo('https://github.com/balovzena9-ops/KRIAP/releases/download/KRIAP/MayUmshka.mp4', 'https://github.com/balovzena9-ops/KRIAP/blob/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F128_20261106164158.png?raw=true', 'MayUmshka')">
                        СМОТРЕТЬ ТИЗЕР <span style="font-size: 16px; margin-top: 2px;">▶</span>
                    </button>
                </div>
            </div>

            <!-- Информация о компании -->
            <div class="company-info">
                <span>Криап-майская компания</span>, по созданию сериалов и фильмов! Хороших и интересных!
            </div>
        </main>
    </div>

    <!-- ПОЛНОЭКРАННЫЙ ПЛЕЕР -->
    <div class="video-overlay" id="videoOverlay">
        <!-- Инфо в углу (появляется при движении) -->
        <div class="video-top-info" id="videoTopInfo">
            <img src="" alt="Обложка" class="video-mini-logo" id="miniLogo">
            <div class="video-mini-title" id="miniTitle"></div>
        </div>

        <button class="close-btn" id="closeBtn" onclick="closeVideo()">✖</button>
        
        <video id="mainVideo" playsinline></video>

        <!-- Кастомные контролы -->
        <div class="custom-controls" id="customControls">
            <div class="controls-row">
                <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" id="playIcon">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" id="pauseIcon" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                
                <div class="seek-container" id="seekContainer">
                    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        // --- ЛОГИКА ПОИСКА ---
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', function(e) {
            const searchText = e.target.value.toLowerCase().trim();
            const movies = document.querySelectorAll('.movie-item');

            movies.forEach(movie => {
                const title = movie.querySelector('.movie-title').textContent.toLowerCase();
                if (title.includes(searchText)) {
                    movie.style.display = 'flex';
                } else {
                    movie.style.display = 'none';
                }
            });
        });

        // --- ЛОГИКА ИНФО ---
        function toggleInfo(event, popupId) {
            event.stopPropagation();
            const popup = document.getElementById(popupId);
            
            document.querySelectorAll('.info-popup').forEach(p => {
                if (p.id !== popupId) p.classList.remove('active');
            });

            popup.classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            document.querySelectorAll('.info-popup').forEach(popup => {
                if (popup.classList.contains('active')) {
                    const btn = popup.parentElement.querySelector('.info-btn');
                    if (!btn.contains(event.target) && !popup.contains(event.target)) {
                        popup.classList.remove('active');
                    }
                }
            });
        });

        // --- ЛОГИКА ВИДЕО (PIXEL STYLE) ---
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('mainVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const customControls = document.getElementById('customControls');
        const videoTopInfo = document.getElementById('videoTopInfo');
        const closeBtn = document.getElementById('closeBtn'); // Наш крестик
        const miniLogo = document.getElementById('miniLogo');
        const miniTitle = document.getElementById('miniTitle');

        let hideControlsTimeout;

        // Открытие видео
        function openVideo(url, posterUrl, title) {
            video.src = url;
            miniLogo.src = posterUrl;
            miniTitle.textContent = title;
            
            overlay.classList.add('active');
            
            // Сброс времени и старт
            video.currentTime = 0;
            video.play();
            updatePlayIcon();
            
            // Показываем контролы при старте
            showControls();
            
            // Запускаем таймер скрытия
            resetHideTimer();
        }

        // Закрытие видео
        function closeVideo() {
            overlay.classList.remove('active');
            video.pause();
            video.src = "";
        }

        // Плей/Пауза
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayIcon();
            resetHideTimer();
        }

        function updatePlayIcon() {
            if (video.paused) {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
        }

        // Обновление полосы и времени
        video.addEventListener('timeupdate', () => {
            if (!isNaN(video.duration)) {
                const percent = (video.currentTime / video.duration) * 100;
                seekBar.value = percent;
                
                // Красим ползунок
                seekBar.style.background = `linear-gradient(to right, #fff ${percent}%, rgba(255,255,255,0.2) ${percent}%)`;
                
                // Обновление текста времени
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        });

        // Перемотка
        seekBar.addEventListener('input', () => {
            const seekTime = (seekBar.value / 100) * video.duration;
            video.currentTime = seekTime;
            resetHideTimer();
        });

        // Форматирование времени (0:00)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Показ/Скрытие элементов управления
        function showControls() {
            customControls.classList.remove('hidden');
            videoTopInfo.classList.remove('hidden');
            closeBtn.classList.remove('hidden'); // Показываем крестик
        }

        function hideControls() {
            if (!video.paused) { // Скрываем только если видео играет
                customControls.classList.add('hidden');
                videoTopInfo.classList.add('hidden');
                closeBtn.classList.add('hidden'); // Скрываем крестик
            }
        }

        function resetHideTimer() {
            showControls();
            clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(hideControls, 3000); // Скрыть через 3 сек
        }

        // Отслеживание движения мыши / касаний для показа контролов
        overlay.addEventListener('mousemove', resetHideTimer);
        overlay.addEventListener('touchstart', resetHideTimer);
        overlay.addEventListener('click', (e) => {
            // Если кликнули не по кнопкам, ставим на паузу или плей
            if (e.target === video || e.target === overlay) {
                togglePlay();
            }
        });

        // Обработка окончания видео
        video.addEventListener('ended', () => {
            updatePlayIcon();
            showControls();
        });
    </script>
</body>
</html>
